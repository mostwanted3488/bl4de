name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build VST3 + AU
        run: cmake --build build --config Release --target bl4de_VST3 bl4de_AU -j 4

      - name: Package
        run: |
          mkdir -p out
          cp -R build/bl4de_artefacts/Release/VST3/bl4de.vst3 out/
          cp -R build/bl4de_artefacts/Release/AU/bl4de.component out/
          codesign --force --deep --sign - out/bl4de.vst3
          codesign --force --deep --sign - out/bl4de.component
          cp README.md out/
          cd out && zip -r -y ../bl4de-mac.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: bl4de-mac
          path: bl4de-mac.zip

      - name: Release (lien de téléchargement direct)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          lipo -info out/bl4de.vst3/Contents/MacOS/bl4de
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "bl4de (Mac)" --notes "VST3 + AU, macOS Apple Silicon + Intel. Voir README pour l'installation."
          gh release upload latest bl4de-mac.zip --clobber

  windows:
    needs: macos
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: WebView2 SDK
        shell: pwsh
        run: |
          Register-PackageSource -ProviderName NuGet -Name nugetRepository -Location https://www.nuget.org/api/v2 -Force
          Install-Package Microsoft.Web.WebView2 -Scope CurrentUser -RequiredVersion 1.0.1901.177 -Source nugetRepository -Force

      - name: Configure
        run: cmake -B build -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target bl4de_VST3

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse build/bl4de_artefacts/Release/VST3/bl4de.vst3 out/
          Copy-Item README.md out/
          Compress-Archive -Path out/* -DestinationPath bl4de-windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: bl4de-windows
          path: bl4de-windows.zip

      - name: Release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload latest bl4de-windows.zip --clobber
