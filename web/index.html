<script>

const DOT_B=mkDots('#000'),DOT_W=mkDots('#fff');

/* ---------- squelettes ---------- */
const J=['p','n','h','rE','rH','lE','lH','rK','rF','lK','lF'],P={};

let uid=0;
class Fig{
 constructor(x,hero){Object.assign(this,{id:uid++,x,y:0,vx:0,vy:0,dir:1,pose:'idle',k:22,float:false,ghost:0,gt:0,trail:[],hero,dead:false,run:false,rt:0,poseT:0});
  this.j={};for(const n of J)this.j[n]=P.idle[n].slice();}
 setPose(p,k=22){this.pose=p;this.k=k;this.poseT=0;}
 upd(dt){if(dt<=0)return;this.poseT+=dt;
  if(this.run){this.rt+=dt;this.pose=((this.rt*(this.hero?12:9))|0)%2?'run1':'run2';this.k=30;}
  const tp=P[this.pose],t=1-Math.exp(-this.k*dt);
  for(const n of J){const a=this.j[n],b=tp[n];a[0]+=(b[0]-a[0])*t;a[1]+=(b[1]-a[1])*t;}
  if(!this.float)this.vy-=1300*dt;
  this.x+=this.vx*dt;this.y+=this.vy*dt;
  if(this.y<=0&&!this.float){if(this.vy<-600){dust(this.x,4);}this.y=0;if(this.vy<0)this.vy=0;this.vx*=Math.exp(-7*dt);}
  if(this.y<0)this.y=0;
  if(this.ghost>0){this.ghost-=dt;this.gt-=dt;if(this.gt<=0){this.gt=.022;this.trail.push({w:this.world(),a:.7,sa:this.sa,dir:this.dir});}}
  for(const q of this.trail)q.a-=dt*3.5;this.trail=this.trail.filter(q=>q.a>0);}
 world(){const o={},bob=(this.pose==='idle'||this.pose==='ready')?-Math.abs(Math.sin(beatPos()*Math.PI))*1.8:0;
  J.forEach((n,i)=>{const p=this.j[n],jx=(hsh(this.id,i)-.5)*1.1,jy=(hsh(i,this.id)-.5)*1.1;o[n]=[this.x+(p[0]+jx)*this.dir,Math.max(-.5,this.y+p[1]+jy+(i<7&&i>0?bob:0))];});return o;}
 hand(){const p=this.j.rH;return{x:this.x+p[0]*this.dir,y:this.y+p[1]};}
 chest(){return{x:this.x+this.j.n[0]*.5*this.dir,y:this.y+(this.j.n[1]+this.j.p[1])/2};}
}

/* ---------- héros ---------- */
const Hr=new Fig(0,true);Hr.sa=-.6;Hr.sw=null;Hr.spin=0;Hr.scarf=[];for(let i=0;i<6;i++)Hr.scarf.push([0,50]);Hr.tails=[[],[]];for(const t of Hr.tails)for(let i=0;i<11;i++)t.push([0,60]);
let SWL=84;Hr.px=0;Hr.py=0;Hr.mvx=0;Hr.mvy=0;
function swAngle(f,sa){return f.dir>0?sa:Math.PI-sa;}
function heroUpd(dt){if(dt<=0)return;
 if(Hr.sw){const s=Hr.sw;s.t+=dt;const k=Math.min(1,s.t/s.d),e=1-Math.pow(1-k,3);Hr.sa=lerp(s.a,s.b,e);if(k>=1)Hr.sw=null;}
 else if(Hr.spin>0){Hr.spin-=dt;Hr.sa-=dt*34;}
 else{let rest=Hr.run||Hr.pose==='dash'?-2.75:Hr.pose==='raise'?1.57:Hr.pose==='block'?1.45:Hr.y>1?-2.3:-.55;if(WN==='deagle')rest=Hr.pose==='raise'?1.2:Hr.run||Hr.pose==='dash'?-1.2:-.3;if(WN==='faux'&&Hr.pose!=='raise'&&Hr.pose!=='block')rest=Hr.run||Hr.pose==='dash'?2.7:Hr.y>1?2.4:2.15;let d=rest-Hr.sa;d=Math.atan2(Math.sin(d),Math.cos(d));Hr.sa+=d*(1-Math.exp(-14*dt));}
 // cape : vitesse réelle
 Hr.mvx=lerp(Hr.mvx,(Hr.x-Hr.px)/dt,.3);Hr.mvy=lerp(Hr.mvy,(Hr.y-Hr.py)/dt,.3);Hr.px=Hr.x;Hr.py=Hr.y;
 const w=Hr.world(),sc=Hr.scarf,spd=clamp(Math.abs(Hr.mvx)/700+Math.abs(Hr.mvy)/1100,0,1);
 sc[0]=[lerp(w.p[0],w.n[0],.92)-Hr.dir*2,lerp(w.p[1],w.n[1],.92)];
 const bx=Math.abs(Hr.mvx)>40?-Math.sign(Hr.mvx):-Hr.dir;
 let dx0=lerp(-Hr.dir*.35,bx,spd),dy0=lerp(-1,clamp(-Hr.mvy/900,-1,.6),spd);const dl=Math.hypot(dx0,dy0)||1;dx0/=dl;dy0/=dl;
 for(let i=1;i<sc.length;i++){const pv=sc[i-1],wv=Math.sin(T*(6+spd*10)-i*.7)*(1+spd*2.5),tx=pv[0]+dx0*8-dy0*wv*.5,ty=pv[1]+dy0*8+dx0*wv*.5;
  sc[i][0]=lerp(sc[i][0],tx,.35);sc[i][1]=lerp(sc[i][1],ty,.35);if(sc[i][1]<0.5)sc[i][1]=0.5;
  const dx=sc[i][0]-pv[0],dy=sc[i][1]-pv[1],d=Math.hypot(dx,dy)||1;if(d>8){sc[i][0]=pv[0]+dx/d*8;sc[i][1]=pv[1]+dy/d*8;}}
 // traînes de l'écharpe rouge (nouée derrière la tête)
 const nk=w.n;Hr.tails.forEach((tl,k)=>{tl[0]=[nk[0]-Hr.dir*4,nk[1]+2+(k?-1.5:1)];
  for(let i=1;i<tl.length;i++){const pv=tl[i-1],wv=Math.sin(T*(8+spd*12)-i*.9+k*1.7)*(1.4+spd*3),bx2=lerp(-Hr.dir,bx,spd),by2=lerp(-.65,clamp(-Hr.mvy/900,-1,.8),spd)+(k?-.15:.1),
   tx=pv[0]+bx2*5.5-by2*wv*.4,ty=pv[1]+by2*5.5+bx2*wv*.4+wv*.3-i*.45*(1-spd*.7);tl[i][0]=lerp(tl[i][0],tx,.4);tl[i][1]=lerp(tl[i][1],ty,.4);if(tl[i][1]<.5)tl[i][1]=.5;
   const dx=tl[i][0]-pv[0],dy=tl[i][1]-pv[1],d=Math.hypot(dx,dy)||1;if(d>5.5){tl[i][0]=pv[0]+dx/d*5.5;tl[i][1]=pv[1]+dy/d*5.5;}}});
 // fumée d'ombre de l'épée
 if(Math.random()<.5){const hd=Hr.hand(),a=swAngle(Hr,Hr.sa),u=rnd(.2,1)*SWL;parts.push({t:'w',x:hd.x+Math.cos(a)*u+rnd(-4,4),y:hd.y+Math.sin(a)*u+rnd(-4,4),vx:rnd(-15,15)-Hr.mvx*.15,vy:rnd(15,45),life:rnd(.4,.8),max:.8,w:rnd(2,4.5),dr:2});}}
function drawCape(dir){const sc=Hr.scarf,L=[],R=[];
 for(let i=0;i<sc.length;i++){const a=sc[Math.max(0,i-1)],b=sc[Math.min(sc.length-1,i+1)],tx=b[0]-a[0],ty=b[1]-a[1],d=Math.hypot(tx,ty)||1,nx=-ty/d,ny=tx/d,wd=3+i*1.7;
  L.push([sc[i][0]+nx*wd,sc[i][1]+ny*wd]);R.push([sc[i][0]-nx*wd,sc[i][1]-ny*wd]);}
 ctx.beginPath();ctx.moveTo(L[0][0],L[0][1]);for(const p of L)ctx.lineTo(p[0],p[1]);
 const e=sc[sc.length-1],l=L[L.length-1],r=R[R.length-1];
 for(let k=1;k<=4;k++){const u=k/5,x=lerp(l[0],r[0],u),y=lerp(l[1],r[1],u),pv=sc[sc.length-2],ex=e[0]-pv[0],ey=e[1]-pv[1],d=Math.hypot(ex,ey)||1,len=(k%2?9:3)+hsh(k,7)*4;ctx.lineTo(x+ex/d*len,y+ey/d*len);ctx.lineTo(lerp(l[0],r[0],u+.1),lerp(l[1],r[1],u+.1));}
 for(let i=R.length-1;i>=0;i--)ctx.lineTo(R[i][0],R[i][1]);ctx.closePath();ctx.fill();}
function swing(a,b,d,big=1,col){const w=WP();
 if(w.gun){Hr.sw={a:b+.3,b,t:0,d:.09};Hr.flick=.1;shoot(swAngle(Hr,b),1);return;}
 d*=w.sp;Hr.sw={a,b,t:0,d};const h=Hr.hand(),wa=swAngle(Hr,a),wb=swAngle(Hr,b);
 fx.push({k:'arc',cx:h.x,cy:h.y,r:SWL*.85*big,a0:wa,a1:wb,w:w.aw*big,t:0,sw:d,d:d+.26,col:col||null,seed:Math.random()*99});
 if(w.dbl)fx.push({k:'arc',cx:h.x,cy:h.y,r:SWL*.6*big,a0:wa,a1:wb,w:w.aw*.7*big,t:0,sw:d*1.2,d:d+.36,col:null,seed:Math.random()*99,ghost:1});

/* ---------- ennemis ---------- */
let enemies=[];const KINDS=['angel','crown','plain','plain','spear','angel'];
function spawn(){const side=Math.random()<.5?-1:1,vw=W/(U*cam.z)/2;const e=new Fig(cam.x+side*(vw+rnd(20,90)),false);
 e.kind=pick(KINDS);e.state='run';e.sp=rnd(120,200);e.atk=rnd(.3,.9);e.sc=rnd(.78,.92);
 if(Math.random()<.18){e.x=Hr.x+rnd(-150,150);e.y=rnd(260,340);e.state='air';e.setPose('air');}
 enemies.push(e);}
function enemyUpd(e,dt){if(dt<=0)return;if(e.state==='held'){e.float=true;e.upd(dt);return;}
 const dx=Hr.x-e.x,ad=Math.abs(dx);e.dir=dx>=0?1:-1;
 if(e.state==='run'){e.run=true;e.x+=e.dir*e.sp*dt;if(ad<46){e.run=false;e.state='atk';e.setPose('idle');}
  else if(ad<140&&Math.random()<dt*.5){e.run=false;e.state='air';e.vy=rnd(420,560);e.vx=e.dir*rnd(150,260);e.setPose('air');}}
 else if(e.state==='atk'){if(ad>70){e.state='run';}e.atk-=dt;
  if(e.atk<=0){e.atk=rnd(.4,.9);e.setPose(e.kind==='spear'?'thrust':'punch',50);e.x+=e.dir*6;
   }
  else if(e.poseT>.18)e.setPose('idle');}
 else if(e.state==='air'){if(e.pose!=='knock')e.setPose(e.vy>0?'air':'idle');if(e.y<=0&&e.vy<=0&&e.poseT>.05){if(e.doomed){cut(e,e.dir,true);return;}e.state='run';e.setPose('crouch');e.vx=0;}}
 e.upd(dt);}

/* ---------- effets ---------- */
const fx=[],parts=[],pieces=[];let marks=[];
function star(x,y,s=1){fx.push({k:'star',x,y,s,t:0,d:.22,a:rnd(0,.6)});}
function dust(x,n){for(let i=0;i<n;i++)parts.push({t:'s',x:x+rnd(-8,8),y:rnd(1,6),vx:rnd(-120,120),vy:rnd(20,120),life:rnd(.2,.5),max:.5,w:1.2,seed:Math.random()*9});}
function scribble(x,y,n,sp=400){for(let i=0;i<n;i++){const an=rnd(0,TAU),v=rnd(sp*.3,sp);parts.push({t:'s',x,y,vx:Math.cos(an)*v,vy:Math.sin(an)*v,life:rnd(.25,.6),max:.6,w:rnd(1,1.8),dr:4,seed:Math.random()*9});}}
function inkBurst(x,y,dir,n){for(let i=0;i<n;i++){const an=(dir>0?0:Math.PI)+rnd(-1.1,1.1)+(Math.random()<.3?Math.PI/2:0);const v=rnd(150,620);
 parts.push({t:'i',x,y,vx:Math.cos(an)*v*.8,vy:Math.sin(an)*v*.7+rnd(-60,90),g:2600,life:1,max:1,w:rnd(.8,2.8)});}}
function cut(e,dir=1,quiet){if(e.dead)return;e.dead=true;kills++;killPop=0;if(WN==='faux')fx.push({k:'soul',x:e.x,y:e.y+40,t:0,d:1.1});if(WN==='great')shake(.08);
 const w=e.world(),m=[lerp(w.p[0],w.n[0],.5),lerp(w.p[1],w.n[1],.5)];
 const parts2=[{segs:[[m,w.n],[w.n,w.rE],[w.rE,w.rH],[w.n,w.lE],[w.lE,w.lH]],head:w.h,up:1},{segs:[[w.p,m],[w.p,w.rK],[w.rK,w.rF],[w.p,w.lK],[w.lK,w.lF]],up:0}];
 for(const q of parts2){let cx=0,cy=0,c=0;for(const s of q.segs)for(const p of s){cx+=p[0];cy+=p[1];c++;}cx/=c;cy/=c;
  const tr=p=>[p[0]-cx,p[1]-cy];pieces.push({x:cx,y:cy,vx:dir*rnd(80,320)+rnd(-60,60),vy:q.up?rnd(260,520):rnd(60,200),rot:0,vr:rnd(-14,14),segs:q.segs.map(s=>[tr(s[0]),tr(s[1])]),head:q.head?tr(q.head):null,kind:q.up?e.kind:null,life:2.4,sc:e.sc});}
 inkBurst(m[0],m[1],dir,rint(7,13));star(m[0],m[1],1.2);if(!quiet){shake(.18);hitstop(.035);}}
function killNear(x,y,R,dir){for(const e of enemies)if(!e.dead&&Math.hypot(e.x-x,(e.y+25)-y)<R)cut(e,dir||Math.sign(e.x-x)||1,true);}
function dome(x,R){fx.push({k:'dome',x,R,t:0,d:.45});scribble(x,10,26,600);dust(x,14);shake(.6);}
function wave(x,y,dir,red){fx.push({k:'wave',x,y,dir,r:46,t:0,d:.85,red,seed:Math.random()*9});}
function lineFx(x0,x1,y){fx.push({k:'line',x0,x1,y,t:0,d:.3});}
function speed(an,s){speedA=an;speedT=Math.max(speedT,s);}
function xframe(s){xT=s;xA=rnd(-.3,.3);}

/* ---------- caméra ---------- */
const cam={x:0,y:0,z:1};
function updCam(rdt){const f=1-Math.exp(-5*rdt);cam.x+=(Hr.x+Hr.vx*.08-cam.x)*f;cam.y+=(Math.max(0,Hr.y-(STRIP?35:70))*(STRIP?.95:.85)-cam.y)*f;cam.z+=((1+zoomK)-cam.z)*f;}

  if(e.k==='bmoon'){const u=clamp((MB-e.b0)/(e.b1-e.b0),0,1);if(!e.hit){e.y=lerp(560,40,u*u);e.x+=e.dir*120*dt;if(u>=1){e.hit=true;e.hT=MB;dome(e.x,120);killNear(e.x,0,140);invT=.07;shake(1);zoomK=.2;}}else if(MB-e.hT>.6)e.t=e.d;}
  if(e.k==='bclone'){if(!e.hit&&MB>=e.b1){e.hit=true;if(!e.tgt.dead){swingFx(e);cut(e.tgt,e.dir);}}if(MB>e.b1+.5)e.t=e.d;}
  if(e.k==='bthrow'){const u=clamp((MB-e.b0)/(e.b1-e.b0),0,1);e.an+=dt*26;const h=Hr.hand(),bk=Math.max(0,u-.6)/.4;e.x=lerp(e.x0+e.dir*Math.sin(Math.PI*u)*330,h.x,bk);e.y=lerp(e.y0+Math.sin(Math.PI*u)*45,h.y,bk);
   for(const en of enemies)if(!en.dead&&Math.hypot(en.x-e.x,en.y+25-e.y)<34)cut(en,e.dir,true);if(u>=1)e.t=e.d;}
  if(e.k==='crack'&&dt>0){e.len=Math.min(520,e.len+dt*1400);const tip=e.x0+e.dir*e.len;if(e.t<.4){if(Math.random()<.8)scribble(tip,3,1,300);for(const en of enemies)if(!en.dead&&en.state!=='air'&&Math.abs(en.x-tip)<18){en.state='air';en.vy=rnd(750,950);en.vx=e.dir*100;en.doomed=true;en.setPose('knock');star(en.x,25,.7);}}}
  if(e.k==='fly'&&dt>0){if(e.tgt.dead){e.t=e.d;}else{const c=e.tgt.chest(),dx=c.x-e.x,dy=c.y-e.y,d=Math.hypot(dx,dy)||1;e.an=Math.atan2(dy,dx);if(d<16){cut(e.tgt,Math.sign(dx)||1);e.t=e.d;}else{const st=Math.min(d,1500*dt);e.x+=dx/d*st;e.y+=dy/d*st;if(Math.random()<.5)scribble(e.x,e.y,1,120);}}}
  if(e.k==='wave'&&dt>0){e.x+=e.dir*950*dt;const r=e.r*(1+e.t/e.d*.9);for(const en of enemies)if(!en.dead&&Math.abs(en.x-e.x)<22&&Math.abs(en.y+25-e.y)<r*.9)cut(en,e.dir,true);if(Math.random()<.5)scribble(e.x,e.y+rnd(-r*.6,r*.6),1,250);}
  if(e.t>=e.d)fx.splice(i,1);}}
function updParts(dt){if(dt<=0)return;
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.g)p.vy-=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.dr){const f=Math.exp(-p.dr*dt);p.vx*=f;p.vy*=f;}
  if(p.t==='c'){p.rot+=p.vr*dt;if(p.y<0){p.y=0;p.vy*=-.35;p.vx*=.6;p.vr*=.6;}}
  if(p.t==='i'&&p.y<=0){marks.push({x:p.x,w:p.w*rnd(1.5,3),t:0});p.life=0;}
  if(p.life<=0)parts.splice(i,1);}
 if(parts.length>1500)parts.splice(0,parts.length-1500);if(marks.length>160)marks.splice(0,marks.length-160);
 for(let i=pieces.length-1;i>=0;i--){const q=pieces[i];q.life-=dt;q.vy-=1300*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.rot+=q.vr*dt;
  if(q.y<4){q.y=4;if(q.vy<-200&&Math.random()<.5)inkBurst(q.x,4,Math.sign(q.vx)||1,2);q.vy*=-.25;q.vx*=.55;q.vr*=.5;}if(q.life<=0)pieces.splice(i,1);}
 if(pieces.length>60)pieces.splice(0,pieces.length-60);}
let spawnT=0;
function updEnemies(dt){enemies=enemies.filter(e=>!e.dead&&Math.abs(e.x-Hr.x)<1200);
 for(const e of enemies)enemyUpd(e,dt);
 spawnT-=dt;const want=7+Math.round(level*6);if(spawnT<=0&&enemies.length<want){spawn();spawnT=rnd(.12,.35);}}

/* ---------- musique ---------- */
const ui=document.getElementById('ui'),imp=document.getElementById('imp'),pp=document.getElementById('pp'),fileIn=document.getElementById('file'),bpmB=document.getElementById('bpm');
let gBase=0,gMult=1,gIdx=-99,ki=0,si=0,hi=0,lastHeard=0,uiT=0;
function peaks(o,fps,gap,c){const n=o.length,out=[];let gm=0;for(let i=0;i<n;i++)gm+=o[i];gm/=n||1;const W=Math.round(fps*.4);let s=0,last=-1e9;
 const pre=new Float32Array(n+1);for(let i=0;i<n;i++)pre[i+1]=pre[i]+o[i];
 for(let i=1;i<n-1;i++){const a=Math.max(0,i-W),b=Math.min(n,i+W),lm=(pre[b]-pre[a])/(b-a);
  if(o[i]>lm*c+gm*.8&&o[i]>=o[i-1]&&o[i]>=o[i+1]&&(i-last)/fps>=gap){out.push(i/fps);last=i;}}return out;}
function analyse(buf){const sr=buf.sampleRate,n=buf.length,c0=buf.getChannelData(0),c1=buf.numberOfChannels>1?buf.getChannelData(1):null,hop=512,F=Math.floor(n/hop),fps=sr/hop;
 const eL=new Float32Array(F),eM=new Float32Array(F),eH=new Float32Array(F),k=f=>Math.exp(-2*Math.PI*f/sr);
 const aL=k(150),a1=k(1200),a2=k(5000),aH=k(7000);let l=0,m1=0,m2=0,h1=0;
 for(let f=0;f<F;f++){let sl=0,sm=0,sh=0;for(let i=f*hop,e=i+hop;i<e;i++){const x=c1?(c0[i]+c1[i])*.5:c0[i];
   l=(1-aL)*x+aL*l;m1=(1-a1)*x+a1*m1;const hp=x-m1;m2=(1-a2)*hp+a2*m2;h1=(1-aH)*x+aH*h1;const hh=x-h1;sl+=l*l;sm+=m2*m2;sh+=hh*hh;}
  eL[f]=Math.sqrt(sl/hop);eM[f]=Math.sqrt(sm/hop);eH[f]=Math.sqrt(sh/hop);}
 const nz=e=>{let m=1e-9;for(let i=0;i<F;i++)m=Math.max(m,e[i]);for(let i=0;i<F;i++)e[i]/=m;};nz(eL);nz(eM);nz(eH);
 const dp=e=>{const o=new Float32Array(F);for(let i=1;i<F;i++)o[i]=Math.max(0,e[i]-e[i-1]);return o;};
 const oL=dp(eL),oM=dp(eM),oH=dp(eH),O=new Float32Array(F);for(let i=0;i<F;i++)O[i]=oL[i]+.7*oM[i];
 // tempo par autocorrélation
 const st=Math.floor(F*.1),en=Math.min(F,st+Math.floor(fps*120)),lo=Math.floor(fps*60/185),hiL=Math.ceil(fps*60/68);let best=-1,bl=lo;const ac=[];
 for(let L=lo;L<=hiL;L++){let s=0;for(let i=st;i+L<en;i++)s+=O[i]*O[i+L];const bpm=60*fps/L,w=Math.exp(-.5*Math.pow(Math.log2(bpm/120)/.9,2));ac[L]=s;if(s*w>best){best=s*w;bl=L;}}
 let lag=bl;if(ac[bl-1]!==undefined&&ac[bl+1]!==undefined){const y0=ac[bl-1],y1=ac[bl],y2=ac[bl+1],d=(y0-2*y1+y2);if(d)lag=bl+.5*(y0-y2)/d;}
 // phase
 let bo=0,bs=-1;for(let off=0;off<lag;off+=.5){let s=0;for(let x=off;x<F;x+=lag)s+=O[Math.round(x)]+.5*(O[Math.round(x)+1]||0);if(s>bs){bs=s;bo=off;}}
 const pn=o=>{const a=Array.from(o).filter(v=>v>0).sort((x,y)=>x-y);const q=a[Math.floor(a.length*.98)]||1;for(let i=0;i<F;i++)o[i]/=q;};pn(oL);pn(oM);pn(oH);
 const at=(arr,t)=>{const i=Math.round(t*fps);let m=0;for(let j=i-1;j<=i+1;j++)m=Math.max(m,arr[j]||0);return m;};
 const kicks=peaks(oL,fps,.19,1.5).filter(t=>at(oL,t)>=at(oM,t)*.9&&at(oL,t)>.25);
 const snares=peaks(oM,fps,.09,1.6).filter(t=>at(oM,t)>at(oL,t)*1.1&&at(oM,t)>=at(oH,t)*.8&&at(oM,t)>.25);
 const hats=peaks(oH,fps,.06,1.7).filter(t=>at(oH,t)>.2);
 let BLs=lag/fps,off=bo/fps;const src=kicks.length>8?kicks:snares;
 for(let it=0;it<3;it++){const P=[];for(const t of src){const q=(t-off)/BLs,n=Math.round(q);if(Math.abs(q-n)<.22)P.push([n,t]);}
  if(P.length<6)break;let sn=0,st=0,snn=0,snt=0;for(const [n,t] of P){sn+=n;st+=t;snn+=n*n;snt+=n*t;}const N=P.length,d=N*snn-sn*sn;if(!d)break;
  const b2=(N*snt-sn*st)/d,a2=(st-b2*sn)/N;if(b2>BLs*.9&&b2<BLs*1.1){BLs=b2;off=a2;}}
 off=((off%BLs)+BLs)%BLs;
 const AC=new Float32Array(F);for(let i=0;i<F;i++)AC[i]=oL[i]+oM[i]*.8+oH[i]*.35;
 const ap=peaks(AC,fps,.17,1.4).map(t=>[t,at(AC,t)]),sv=ap.map(a=>a[1]).sort((x,y)=>x-y),thr=sv[Math.floor(sv.length*.45)]||0,mx=sv[Math.floor(sv.length*.95)]||1;
 const accents=ap.filter(a=>a[1]>=thr).map(a=>[a[0],clamp(a[1]/mx,0,1)]);
 return{BL:BLs,off,kicks,snares,hats,accents};}

function seek(t){const f=a=>{let lo=0,h2=a.length;while(lo<h2){const m=(lo+h2)>>1;if(a[m]<t)lo=m+1;else h2=m;}return lo;};ki=f(grid.kicks);si=f(grid.snares);hi=f(grid.hats);gIdx=Math.floor((t-grid.off)/grid.BL);}
const bp=document.getElementById('bp'),bpmIn=document.getElementById('bpmIn');let taps=[];
function setBPM(v){if(!grid)return;v=clamp(v,40,300);grid.BL=60/v;gBase=grid.BL;BL=grid.BL;rebuildBeats();bpmIn.value=Math.round(v*10)/10;if(au)seek(heard());}
function setMult(){bp.style.display='flex';bp.hidden=false;bpmB.hidden=true;setBPM(60/grid.BL);}
const curB=()=>60/grid.BL;
document.getElementById('bm').onclick=()=>setBPM(curB()-1);document.getElementById('bpl').onclick=()=>setBPM(curB()+1);
document.getElementById('bh').onclick=()=>setBPM(curB()/2);document.getElementById('bd').onclick=()=>setBPM(curB()*2);
bpmIn.onchange=()=>setBPM(parseFloat(bpmIn.value)||curB());
document.getElementById('bl').onclick=()=>{if(grid){grid.off-=.012;seek(heard());}};document.getElementById('br').onclick=()=>{if(grid){grid.off+=.012;seek(heard());}};
document.getElementById('btap').onclick=()=>{if(!grid||!au)return;const t=heard();if(taps.length&&t-taps[taps.length-1]>2)taps=[];taps.push(t);if(taps.length>8)taps.shift();
 if(taps.length>=3){const iv=(taps[taps.length-1]-taps[0])/(taps.length-1);grid.BL=iv;gBase=iv;BL=iv;grid.off=((t%iv)+iv)%iv;bpmIn.value=Math.round(600/iv)/10;seek(t);}};
function heard(){return Math.max(0,au.currentTime-((actx.outputLatency||0)+(actx.baseLatency||0)));}
function loadFile(f){if(!f)return;try{
 actx=actx||new (window.AudioContext||window.webkitAudioContext)();
 if(au){au.pause();URL.revokeObjectURL(au.src);}
 au=new Audio();au.src=URL.createObjectURL(f);au.loop=true;
 const src=actx.createMediaElementSource(au);an=actx.createAnalyser();an.fftSize=1024;an.smoothingTimeConstant=.3;src.connect(an);an.connect(actx.destination);fd=new Uint8Array(an.frequencyBinCount);
 grid=null;bp.style.display='none';bpmB.hidden=false;bpmB.textContent='ANALYZING…';
 f.arrayBuffer().then(ab=>actx.decodeAudioData(ab)).then(buf=>{grid=analyse(buf);gBase=grid.BL;setMult(1);rebuildBeats();seek(heard());MB=(heard()-grid.off)/grid.BL;lastBi=Math.floor(MB+1e-6);lastHalf=Math.floor(MB*2+1e-6);resync(true);}).catch(()=>{bpmB.textContent='BPM ?';});
 actx.resume();au.play().catch(()=>{});imp.textContent='♪ '+f.name.replace(/\.[^.]+$/,'');pp.hidden=false;pp.textContent='❚❚';}catch(e){imp.textContent='♪ UNREADABLE FILE';}}
const armB=document.getElementById('armB'),arm=document.getElementById('arm');
function refreshArm(){arm.querySelectorAll('button').forEach(b=>b.classList.toggle('on',mixMode?b.dataset.w==='mix':b.dataset.w===WN));}
armB.onclick=()=>{arm.hidden=!arm.hidden;refreshArm();};
arm.querySelectorAll('button').forEach(b=>b.onclick=()=>{const w=b.dataset.w;if(w==='mix'){mixMode=true;setWeapon(pick(Object.keys(WEAPS).filter(k=>k!==WN)));}else{mixMode=false;setWeapon(w);}refreshArm();arm.hidden=true;});
imp.onclick=()=>fileIn.click();
document.getElementById('strip').onclick=e=>{STRIP=!STRIP;if(PLUG){try{window.__JUCE__.backend.emitEvent('strip',{on:STRIP});}catch(_){}}else document.body.classList.toggle('strip',STRIP);e.currentTarget.textContent=STRIP?'▢':'▭';resize();};fileIn.onchange=e=>loadFile(e.target.files[0]);
pp.onclick=()=>{if(!au)return;if(au.paused){actx.resume();au.play();pp.textContent='❚❚';}else{au.pause();pp.textContent='▶';}};
addEventListener('dragover',e=>e.preventDefault());addEventListener('drop',e=>{e.preventDefault();loadFile(e.dataTransfer.files[0]);});
addEventListener('pointermove',()=>{uiT=0;ui.classList.remove('idle');});addEventListener('pointerdown',()=>{uiT=0;ui.classList.remove('idle');});
let invScene=0,gpS=0;function onBeat(){strongN++;drumN++;if(invScene>0)invScene--;
 if(mixMode&&strongN%16===0)setWeapon(pick(Object.keys(WEAPS).filter(k=>k!==WN)));}
let reds=[],snN=0;
const SWS=[[2.4,-1.1],[-2.3,1.4],[1.6,-1.8],[3,-.3],[-1.2,1.9],[2.8,-2.2],[.6,-2.6]];
const onKick=kickHit,onSnare=snareHit;let hatIdx=-1;
function clockTick(rdt){uiT+=rdt;if(PLUG&&hostPlay&&musT-hostT<.5)return;if(uiT>3&&au&&!au.paused)ui.classList.add('idle');
 if(liveA()){const t=heard();if(t<lastHeard-.3)seek(t);lastHeard=t;
  an.getByteFrequencyData(fd);let all=0;for(let i=1;i<200;i++)all+=fd[i];level=all/199/255;
  let c=0;while(ki<grid.kicks.length&&grid.kicks[ki]<=t){ki++;c++;}if(c){onKick();lastOnsetT=musT;}
  c=0;while(si<grid.snares.length&&grid.snares[si]<=t){si++;c++;}if(c){onSnare();lastOnsetT=musT;}
  c=0;while(hi<grid.hats.length&&grid.hats[hi]<=t){hi++;c++;}if(c)hatHit();}
 else{level=au&&!au.paused?.4:0;}}

/* ---------- hôte (plugin bl4de) ---------- */
let hA=-1,PLUG=false,hostT=-9,hostPlay=false,hostBeat=null,hostPpq=0,hK=-1,hS=-1,hH=-1,lastOnsetT=-9;
function onHost(d){hostT=musT;hostPpq=+d.ppq||0;BL=60/clamp(+d.bpm||140,40,300);level=+d.lvl||0;
 const pl=!!d.playing,start=pl&&!hostPlay;hostPlay=pl;if(start){MB=hostPpq;lastBi=Math.floor(MB+1e-6);lastHalf=Math.floor(MB*2+1e-6);resync(true);}
 if(hK<0){hK=d.k;hS=d.s;hH=d.h;hA=d.a|0;}if((d.a|0)!==hA){hA=d.a|0;accentHit();}
 if(d.k!==hK){hK=d.k;kickHit();lastOnsetT=musT;}if(d.s!==hS){hS=d.s;snareHit();lastOnsetT=musT;}if(d.h!==hH){hH=d.h;hatHit();}}
(function hook(n){const b=window.__JUCE__&&window.__JUCE__.backend;if(b&&b.addEventListener){PLUG=true;document.body.classList.add('plug');b.addEventListener('host',onHost);}else if(n<100)setTimeout(()=>hook(n+1),100);})(0);
/* ---------- boucle ---------- */
let lastT=performance.now();
function loop(now){const rdt=Math.min(.05,(now-lastT)/1000);lastT=now;T+=rdt;musT+=rdt;clockTick(rdt);updMB(rdt);
 let dt=rdt;if(slowT>0){slowT-=rdt;dt*=slowF;}if(hsT>0){hsT-=rdt;dt=0;}DT=dt;
 runDir(dt);heroUpd(dt);Hr.upd(dt);if(Hr.flick>0)Hr.flick-=rdt;updEnemies(dt);updFx(dt);updParts(dt);
 for(const m of marks)m.t+=rdt;marks=marks.filter(m=>m.t<4);
 trauma=Math.max(0,trauma-rdt*2);invT-=rdt;xT-=rdt;redT-=rdt;speedT-=rdt;killPop+=rdt;zoomK*=Math.exp(-4*rdt);
 blackT=(xT>0||invScene>0)?1:0;gpS=Math.max(0,gpS-rdt*6);for(const r of reds)r.t+=rdt;reds=reds.filter(r=>r.t<r.d);updCam(rdt);draw();requestAnimationFrame(loop);}

requestAnimationFrame(loop);
